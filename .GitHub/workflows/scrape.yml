name: Scrape Pune Jobs

on:
  schedule:
    # Runs every day at 3:30 AM IST.
    # GitHub cron uses UTC, so 22:00 UTC = 3:30 AM IST.
    - cron: "0 22 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scraper.py"
      - "requirements.txt"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          python scraper.py

      - name: Save updated jobs CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.csv

          if git diff --cached --quiet; then
            echo "No changes to jobs.csv"
          else
            git commit -m "Update Pune jobs data"
            git push
          fi
